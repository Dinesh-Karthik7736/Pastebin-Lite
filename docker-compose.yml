services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pastebox
      POSTGRES_PASSWORD: pastebox
      POSTGRES_DB: pastebox
    ports:
      - "5432:5432"
    volumes:
      - pastebox-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pastebox-postgres:
